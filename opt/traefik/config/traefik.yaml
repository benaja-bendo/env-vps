api:
  dashboard: true
  insecure: false
  debug: true

log:
  level: DEBUG

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: traefik-network
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  le:
    acme:
      email: benaja.bendo02@gmail.com
      storage: /etc/traefik/certs/acme.json
      httpChallenge:
        entryPoint: web

accessLog:
  filePath: "/etc/traefik/logs/access.log"
  bufferingSize: 100
  filters:
    statusCodes: ["200", "300-302", "400-499", "500-599"]
  fields:
    defaultMode: keep
    names:
      ClientUsername: drop
    headers:
      defaultMode: drop

metrics:
  prometheus:
    entryPoint: web
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

tracing:
  jaeger:
    collector:
      endpoint: "jaeger:14268"
